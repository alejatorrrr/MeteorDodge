name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check bundled privacy policy
        run: python3 tools/build_privacy.py --check
      - name: Test game mechanics
        run: node --test tests/*.test.cjs
      - name: Install browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test mobile game interface
        run: node tests/browser-smoke.cjs
      - name: Upload visual previews
        uses: actions/upload-artifact@v4
        with:
          name: MeteorDodge-preview
          path: /tmp/MeteorDodge-*.png
          retention-days: 14
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build and lint debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:lintDebug
      - name: Validate production AdMob build (unsigned)
        run: gradle --no-daemon --stacktrace :app:assembleRelease :app:bundleRelease :app:lintRelease
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: MeteorDodge-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Prepare unsigned distribution and public signing tool
        run: |
          mkdir -p distribution
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -P 16 -f 4 app/build/outputs/apk/release/app-release-unsigned.apk distribution/MeteorDodge-unsigned.apk
          cp app/build/outputs/bundle/release/app-release.aab distribution/MeteorDodge-unsigned.aab
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" distribution/apksigner.jar
      - name: Upload unsigned distribution
        uses: actions/upload-artifact@v4
        with:
          name: MeteorDodge-release-unsigned
          path: distribution/
          if-no-files-found: error
          retention-days: 30
